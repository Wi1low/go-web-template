basePath: /
definitions:
  model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      trace_id:
        type: string
    type: object
  v1.createUserRequest:
    properties:
      email:
        example: alice@example.com
        maxLength: 128
        type: string
      name:
        example: alice
        maxLength: 64
        minLength: 1
        type: string
    required:
    - email
    - name
    type: object
  v1.loginRequest:
    properties:
      email:
        example: demo@example.com
        type: string
      password:
        example: "123456"
        type: string
    required:
    - email
    - password
    type: object
  v1.updateUserRequest:
    properties:
      email:
        maxLength: 128
        type: string
      name:
        maxLength: 64
        minLength: 1
        type: string
    type: object
info:
  contact: {}
  description: Gin application template with a pluggable module kernel.
  title: go-web-template API
  version: "1.0"
paths:
  /api/v1/login:
    post:
      consumes:
      - application/json
      description: |-
        Replace with real credential verification. The demo accepts
        the seeded user demo@example.com / 123456.
      parameters:
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
              type: object
      summary: Demo login (issues a JWT)
      tags:
      - auth
  /api/v1/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
      security:
      - BearerAuth: []
      summary: Current user (requires bearer token)
      tags:
      - auth
  /api/v1/users:
    get:
      parameters:
      - default: 1
        description: page, 1-based
        in: query
        name: page
        type: integer
      - default: 20
        description: page size
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.User'
                  type: array
              type: object
      summary: List users (paginated)
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.createUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Response'
      summary: Create a user
      tags:
      - users
  /api/v1/users/{id}:
    delete:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Delete a user
      tags:
      - users
    get:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      summary: Fetch a user by id
      tags:
      - users
    put:
      consumes:
      - application/json
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: integer
      - description: fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.updateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.User'
              type: object
      summary: Update a user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Bearer <token> from /api/v1/login
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
